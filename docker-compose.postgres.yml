services:
  sync:
    container_name: opentubex-sync
    image: ghcr.io/opentubex/sync-server:latest-postgres
    build:
      context: .
      args:
        - "DATABASE_BACKEND=postgres"
    environment:
      - "DATABASE_URL=postgres://postgres:password@db/opentubex-sync"
      - "SECRET_KEY=changeme"
      - "ALLOW_REGISTRATION=true"
      - "VALIDATE_SUBMITTED_METADATA=true"
    # Or use a configuration file:
    # volumes:
    #   - ./config.toml:/app/config.toml
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: opentubex-sync-postgres
    environment:
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=password"
      - "POSTGRES_DB=opentubex-sync"
    volumes:
      - ./data:/var/lib/postgresql
    restart: unless-stopped
